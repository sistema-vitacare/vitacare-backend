# Gateway da stack: o unico container com porta publicada. Distribui os
# requests entre as replicas do servico `api` e e o alvo do Nginx Proxy Manager
# (app-vitacare:1050). Equivale ao nginx interno do molde Laravel; o pool de
# workers do php-fpm aqui e o conjunto de replicas do Node.

# DNS interno do Docker. valid=10s: replica nova (scale up) entra no rodizio em
# ate 10s; replica removida sai no mesmo prazo, sem recarregar o nginx.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream vitacare_api {
    # `resolve` (nginx >= 1.27.3) reconsulta o nome `api`: cada replica e um
    # IP no rodizio. A zone e obrigatoria para o upstream dinamico.
    zone vitacare_api 64k;
    # Replica com menos requests abertos; tem que vir antes do keepalive.
    least_conn;
    server api:3000 resolve max_fails=3 fail_timeout=10s;

    # Conexoes reaproveitadas com o Node. O keepalive_timeout fica ABAIXO do
    # HTTP_KEEP_ALIVE_TIMEOUT_MS da API (65s): quem fecha o socket ocioso e o
    # nginx, nunca o Node no meio de um request (502 intermitente).
    keepalive 32;
    keepalive_timeout 30s;
}

# Scheme e porta REAIS: atras do NPM chegam em X-Forwarded-*; acesso direto
# por IP, valem os da propria conexao. O NPM nao manda X-Forwarded-Port.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
map "$http_x_forwarded_port:$http_x_forwarded_proto" $fwd_port {
    "~^(\d+):"  $1;
    ":https"    443;
    ":http"     80;
    default     $server_port;
}

# Uma linha por request, com a replica que atendeu e o tempo dela. $uri sem a
# query string: nada de token ou dado pessoal de parametro no log.
log_format gateway 'gw $request_method $uri $status ${request_time}s '
                   'up=$upstream_addr ${upstream_response_time}s '
                   'req=$request_id';

server {
    listen 1050;                       # MESMA porta publicada no host
    server_name _;
    server_tokens off;

    access_log /dev/stdout gateway;
    error_log  /dev/stderr warn;

    # O body JSON da API e limitado pelo Express (100kb); este teto so impede
    # upload gigante de chegar ao Node. Ajustar quando houver anexos (RF009).
    client_max_body_size 10m;

    location / {
        proxy_pass http://vitacare_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";            # keepalive com o upstream
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Port $fwd_port;
        proxy_set_header X-Request-Id $request_id;

        # Hierarquia (de dentro para fora): consulta 30s < request do Node 60s
        # < proxy_read_timeout 75s < proxy publico (>= 90s). Invertida, o
        # request morre aqui fora e a API nao registra nada.
        # Connect dentro da rede docker leva menos de 1ms; 2s so cobre replica
        # que morreu sem fechar o socket (IP some, o SYN fica sem resposta).
        proxy_connect_timeout 2s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;

        # Replica caindo no deploy/scale: GET/HEAD vao para outra. POST nao e
        # repetido (o nginx so repete metodos idempotentes). Tenta quantas
        # replicas houver, limitado por tempo.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 0;
        proxy_next_upstream_timeout 10s;
    }

    # Healthcheck do proprio gateway: nao passa pela API.
    location = /gateway/health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
