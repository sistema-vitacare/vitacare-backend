services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: vitacare-backend:latest
    container_name: vitacare-backend
    restart: unless-stopped
    env_file:
      - ${VITACARE_ENV_FILE:-.env}
    environment:
      # Sobrepoe qualquer PORT do env_file. O compose nao interpola variaveis
      # vindas de env_file, entao a porta interna precisa ser fixa para que o
      # mapeamento abaixo seja sempre coerente.
      PORT: 3000
    ports:
      - "${HOST_PORT:-3000}:3000"
    init: true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/health/live >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true

# PostgreSQL e Redis sao externos: o container precisa entrar na rede onde eles
# ja existem. Crie-a uma vez com `docker network create vitacare-net` ou aponte
# DOCKER_NETWORK para a rede que ja hospeda esses servicos.
networks:
  default:
    name: ${DOCKER_NETWORK:-vitacare-net}
    external: true
